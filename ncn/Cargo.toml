[workspace]
members = ["cli", "ledger", "verifier-service"]
# merkle-tree and the program belong to the repo-root workspace: they are
# (dev-)dependencies of the on-chain programs, and verified builds run the
# root workspace under older cargo versions that reject path dependencies
# claimed by a different workspace.
# The Codama client keeps its own lockfile (Solana 3.x) so it does not share
# a resolver with the Agave 4.x CLI/ledger crates.
exclude = ["merkle-tree", "programs/ncn-snapshot", "clients"]

resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

