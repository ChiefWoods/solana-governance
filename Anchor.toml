[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[workspace]
members = [
    "ncn/programs/ncn-snapshot",
    "svmgov/program/programs/svmgov_program",
]

[programs.localnet]
ncn_snapshot = "ncnwF8AgynRcdEnGLcprSQNaKvgSMTgk3yPRc8cf9Zf"
svmgov_program = "govYkyQ3ePtGULAtY6V75qjWE8UH4vCUVQ1W4HdCAZU"

[programs.devnet]
svmgov_program = "govYkyQ3ePtGULAtY6V75qjWE8UH4vCUVQ1W4HdCAZU"

[programs.testnet]
svmgov_program = "govYkyQ3ePtGULAtY6V75qjWE8UH4vCUVQ1W4HdCAZU"

[programs.mainnet]
svmgov_program = "govYkyQ3ePtGULAtY6V75qjWE8UH4vCUVQ1W4HdCAZU"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
